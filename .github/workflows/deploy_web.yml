name: Deploy Flutter Web

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'

      - name: Install dependencies
        working-directory: nutristart_frontend
        run: flutter pub get

      - name: Build web
        working-directory: nutristart_frontend
        run: flutter build web --release --base-href "/NutriStart/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nutristart_frontend/build/web

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4